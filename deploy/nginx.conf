# Portal production server (I1-3).
# SPA fallback + hashed-asset long cache + gzip + security headers + healthz.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Health check (compose / k8s probes) ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # ---- Hashed build assets: immutable ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- 3D 资产 MIME（GLB；见 docs/asset-pipeline.md）----
    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ---- Platform gateway WebSocket reverse proxy (enable in production) ----
    # location /gateway {
    #     proxy_pass http://gateway:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 3600s;
    # }

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml application/xml;

    # ---- Security headers (§80; scenes are trusted internal code) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 注意：CSP 必须单行书写——nginx 不支持字符串反斜杠续行（多行会输出
    # 字面换行，破坏响应头并导致容器 wget 健康检查失败）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'" always;
}
